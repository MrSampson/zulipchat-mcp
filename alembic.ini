[alembic]
# Dev-only convenience for the `alembic` CLI against a scratch DuckDB file
# (gitignored, repo root - no directory to create first). Not read at
# runtime - DatabaseManager builds its own Config programmatically in
# utils/migrations.py, pointed at the real db_path.
#
# `alembic revision -m "..."` (empty scaffold) works fine, as does
# `alembic upgrade head --sql` (a good way to see exact DDL to transcribe
# into a new revision). `alembic revision --autogenerate` does NOT work:
# duckdb_engine 0.17.0 reuses Postgres's reflection SQL wholesale for schema
# diffing, and it queries pg_catalog.pg_collation, which DuckDB doesn't
# implement - autogenerate crashes outright. Write new revisions by hand
# against utils/schema.py until duckdb_engine's reflection support catches
# up (see issue #3's compatibility warning).
script_location = src/zulipchat_mcp/migrations
sqlalchemy.url = duckdb:///alembic_dev.duckdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
